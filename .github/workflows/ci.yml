name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked

  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            cross: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-13
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install cross linker (Linux ARM64)
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          mkdir -p .cargo
          printf '[target.aarch64-unknown-linux-gnu]\nlinker = "aarch64-linux-gnu-gcc"\n' > .cargo/config.toml
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Collect artifact and checksum
        shell: bash
        run: |
          case "${{ matrix.target }}" in
            *windows*) BIN=qimen_dynamic_plugin_mofang_ticket.dll ;;
            *darwin*)  BIN=libqimen_dynamic_plugin_mofang_ticket.dylib ;;
            *)         BIN=libqimen_dynamic_plugin_mofang_ticket.so ;;
          esac
          cp "target/${{ matrix.target }}/release/$BIN" "./$BIN"
          case "${{ matrix.os }}" in
            macos-*) shasum -a 256 "$BIN" > "$BIN.sha256" ;;
            *)       sha256sum "$BIN" > "$BIN.sha256" ;;
          esac
          ls -la
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            qimen_dynamic_plugin_mofang_ticket.dll
            libqimen_dynamic_plugin_mofang_ticket.so
            libqimen_dynamic_plugin_mofang_ticket.dylib
            *.sha256
          if-no-files-found: error

  release:
    name: Draft Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Combined checksums
        run: |
          cd dist
          rm -f *.sha256
          sha256sum *.dll *.so *.dylib > SHA256SUMS
          ls -la
      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/*
          generate_release_notes: true
